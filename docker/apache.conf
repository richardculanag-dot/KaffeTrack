# Serve only the public/ folder — .env, app code and vendor/ are never reachable from the web.
<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Long-lived caching for Vite's fingerprinted assets.
    <Directory /var/www/html/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
